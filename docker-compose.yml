services:
  minio:
    image: minio/minio:latest
    container_name: iss-visibility-fixes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: iss-visibility-fixes-minio-init
    depends_on:
      - minio
    volumes:
      - ./assets/images:/import/images:ro
      - ./assets/video:/import/video:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/iss-visibility;
      mc anonymous set download local/iss-visibility;
      mc cp --recursive /import/images/ local/iss-visibility/ || true;
      mc cp --recursive /import/video/ local/iss-visibility/ || true;
      mc ls local/iss-visibility;
      "

volumes:
  minio-data:
