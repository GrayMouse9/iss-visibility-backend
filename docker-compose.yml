services:
  minio:
    image: minio/minio:latest
    container_name: iss-visibility-fixed-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: iss-visibility-fixed-minio-init
    depends_on:
      - minio
    volumes:
      - ./assets/images:/import/images:ro
      - ./assets/video:/import/video:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/iss-visibility;
      mc anonymous set download local/iss-visibility;
      mc cp --recursive /import/images/ local/iss-visibility/ || true;
      mc cp --recursive /import/video/ local/iss-visibility/ || true;
      mc ls local/iss-visibility;
      "

  postgres:
    image: postgres:16
    container_name: iss-visibility-fixed-postgres
    environment:
      POSTGRES_USER: iss
      POSTGRES_PASSWORD: iss
      POSTGRES_DB: iss_visibility
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iss -d iss_visibility"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: iss-visibility-fixed-adminer
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  minio-data:
  postgres-data:
