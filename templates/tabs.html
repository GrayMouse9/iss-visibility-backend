{{ define "tabs" }}
<nav class="tabs">
    <a class="tab{{ if eq .active "feed" }} tab--active{{ end }}" href="/feed">
        <span class="tab__icon tab__icon--feed"></span>
        <span class="tab__label">Лента</span>
    </a>
    <a class="tab{{ if eq .active "add" }} tab--active{{ end }}" href="/add">
        <span class="tab__icon tab__icon--add"></span>
        <span class="tab__label">Добавление</span>
    </a>
    <a class="tab{{ if eq .active "points" }} tab--active{{ end }}" href="/points">
        <span class="tab__icon tab__icon--points"></span>
        <span class="tab__label">Плитка</span>
    </a>
</nav>
{{ end }}
