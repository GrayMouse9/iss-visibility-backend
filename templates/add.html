<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая точка наблюдения — Время видимости МКС</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
<div class="phone">
    <div class="page">
        {{ with .point }}
        <h1 class="title">Новая точка наблюдения</h1>

        <section class="field field--divided">
            <div class="field__label">Изображение</div>
            <img class="media" src="{{ .ImageURL }}" alt="{{ .Name }}">
        </section>

        <section class="field field--divided">
            <div class="field__label">Видео</div>
            <video class="media" src="{{ .VideoURL }}" poster="{{ .ImageURL }}"
                   autoplay muted loop playsinline></video>
        </section>

        <section class="field">
            <div class="field__label">Название</div>
            <input class="input" type="text" value="{{ .Name }}">
        </section>

        <section class="field">
            <div class="field__label">Краткое описание</div>
            <textarea class="input input--multiline" rows="2">{{ .Description }}</textarea>
        </section>

        <section class="field field--row">
            <div class="field__col">
                <div class="field__label">Широта, °</div>
                <input class="input input--number" type="text" inputmode="decimal" value="{{ printf "%.4f" .Latitude }}">
            </div>
            <div class="field__col">
                <div class="field__label">Долгота, °</div>
                <input class="input input--number" type="text" inputmode="decimal" value="{{ printf "%.4f" .Longitude }}">
            </div>
        </section>

        <section class="field">
            <div class="field__label">Высота над уровнем моря, м</div>
            <input class="input input--number" type="text" inputmode="numeric" value="{{ .Altitude }}">
        </section>

        <div class="action-row action-row--publish">
            <span class="action-row__label">Опубликовать</span>
            <span class="round-arrow"></span>
        </div>
        {{ else }}
        <p class="empty">{{ with .error }}{{ . }}{{ else }}Черновик не найден{{ end }}</p>
        {{ end }}
    </div>

    {{ template "tabs" . }}
</div>
</body>
</html>
